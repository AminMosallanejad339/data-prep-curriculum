<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Preparation — Master Curriculum | Amin Mosallanejad</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2339ff14'/%3E%3C/svg%3E">
<style>
  :root {
    /* ===== THEME: Absolute Black → Phosphor Green ===== */
    --bg-black:     #000000;   /* absolute black (top) */
    --bg-dark:      #030d06;   /* near black */
    --bg-deep:      #051a0c;   /* deep green */
    --bg-mid:       #082b14;   /* mid green */
    --bg-green:     #0d4a1e;   /* strong green */
    --bg-bright:    #1a6b2e;   /* bright green */
    --bg-phosphor:  #39ff14;   /* phosphor green (bottom) */

    --accent:       #39ff14;   /* phosphor green */
    --accent-2:     #00ff88;   /* neon green */
    --brick:        #22c55e;   /* grass green */
    --brick-glow:   #4ade80;
    --gold:         #a3e635;   /* lime accent */
    --txt:          #d4ffe0;
    --txt-dim:      #7ba88a;
    --line:         rgba(57, 255, 20, 0.15);
    --line-hover:   rgba(57, 255, 20, 0.5);

    --layer1:       #39ff14;
    --layer2:       #2dd4bf;
    --layer3:       #22c55e;
    --layer4:       #a3e635;

    --radius:       14px;
    --shadow:       0 8px 32px rgba(0, 0, 0, 0.6),
                    0 0 60px rgba(57, 255, 20, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--txt);
    line-height: 1.65;
    min-height: 100vh;
    /* ===== THE GRADIENT: Absolute Black → Phosphor Green ===== */
    background:
      radial-gradient(ellipse at 50% 100%, rgba(57, 255, 20, 0.35) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 30%, rgba(13, 74, 30, 0.5) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 20%, rgba(8, 43, 20, 0.5) 0%, transparent 55%),
      linear-gradient(180deg,
        var(--bg-black) 0%,
        var(--bg-dark) 20%,
        var(--bg-deep) 40%,
        var(--bg-mid) 60%,
        var(--bg-green) 78%,
        var(--bg-bright) 90%,
        var(--bg-phosphor) 100%);
    background-attachment: fixed;
    background-size: cover;
  }

  /* Subtle phosphor glow at the bottom */
  body::before {
    content: '';
    position: fixed;
    bottom: -20vh;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    height: 80vh;
    max-width: 1600px;
    background: radial-gradient(ellipse at center,
      rgba(57, 255, 20, 0.28) 0%,
      rgba(57, 255, 20, 0.10) 30%,
      transparent 60%);
    pointer-events: none;
    z-index: 0;
    animation: phosphorPulse 8s ease-in-out infinite;
  }

  @keyframes phosphorPulse {
    0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;   transform: translateX(-50%) scale(1.08); }
  }

  /* ---------- HEADER ---------- */
  header {
    position: relative;
    z-index: 1;
    padding: 3rem 1.5rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), transparent);
  }

  .logo-wrap {
    display: inline-block;
    width: 150px;
    height: 150px;
    margin-bottom: 1rem;
    filter: drop-shadow(0 0 24px rgba(57, 255, 20, 0.5))
            drop-shadow(0 0 48px rgba(57, 255, 20, 0.25));
    animation: logoFloat 6s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .brand-name {
    font-size: 1.05rem;
    letter-spacing: 0.55em;
    color: var(--txt);
    font-weight: 300;
    margin-bottom: 0.9rem;
    padding-left: 0.55em;
    text-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
  }

  h1 {
    font-size: 1.05rem;
    letter-spacing: 0.35em;
    font-weight: 400;
    color: var(--txt-dim);
    margin-bottom: 1.1rem;
    padding-left: 0.35em;
  }

  .tagline {
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .tagline span {
    color: var(--gold);
    margin: 0 0.6rem;
    font-weight: 700;
  }

  /* ---------- CONTROLS ---------- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 1rem 1.5rem;
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    align-items: center;
  }

  .search-box {
    flex: 1 1 280px;
    max-width: 440px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.6rem;
    background: rgba(3, 13, 6, 0.85);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--txt);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }

  .search-box input::placeholder { color: var(--txt-dim); opacity: 0.6; }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(57, 255, 20, 0.2),
                0 0 20px rgba(57, 255, 20, 0.15);
    background: rgba(3, 13, 6, 0.95);
  }

  .search-box .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    opacity: 0.7;
    pointer-events: none;
    width: 16px;
    height: 16px;
  }

  .filter-btns {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.55rem 1rem;
    background: rgba(3, 13, 6, 0.85);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--txt-dim);
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  .filter-btn:hover {
    border-color: var(--line-hover);
    color: var(--txt);
    box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
  }

  .filter-btn.active {
    background: var(--accent);
    color: var(--bg-black);
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 16px rgba(57, 255, 20, 0.6);
  }

  /* ---------- STATS ---------- */
  .stats {
    display: flex;
    justify-content: center;
    gap: 1.8rem;
    padding: 0.75rem;
    font-size: 0.78rem;
    color: var(--txt-dim);
    border-bottom: 1px solid var(--line);
    background: rgba(3, 13, 6, 0.6);
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  .stats strong {
    color: var(--accent);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
  }

  /* ---------- MAIN ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  .layer-header {
    margin: 2.5rem 0 1.2rem;
    padding: 1rem 1.25rem;
    border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(8, 43, 20, 0.7), transparent);
    border-left: 4px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.08);
  }

  .layer-header h2 {
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
  }

  .layer-header .range {
    font-size: 0.78rem;
    color: var(--txt-dim);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    letter-spacing: 0.05em;
  }

  .layer-1 .layer-header { border-color: var(--layer1); }
  .layer-2 .layer-header { border-color: var(--layer2); }
  .layer-3 .layer-header { border-color: var(--layer3); }
  .layer-4 .layer-header { border-color: var(--layer4); }

  /* ---------- ACCORDION ---------- */
  .section {
    margin-bottom: 0.6rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: rgba(3, 13, 6, 0.55);
    backdrop-filter: blur(6px);
    transition: all 0.25s;
  }

  .section:hover { border-color: var(--line-hover); }

  .section.open {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.25),
                0 0 32px rgba(57, 255, 20, 0.15),
                var(--shadow);
    background: rgba(8, 43, 20, 0.85);
  }

  .section-head {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .section-head:hover { background: rgba(57, 255, 20, 0.06); }

  .section-num {
    min-width: 40px;
    height: 40px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 0.88rem;
    background: rgba(8, 43, 20, 0.9);
    color: var(--accent);
    flex-shrink: 0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    border: 1px solid rgba(57, 255, 20, 0.3);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
  }

  .layer-2 .section-num { color: var(--layer2); border-color: rgba(45, 212, 191, 0.3); text-shadow: 0 0 8px rgba(45, 212, 191, 0.5); }
  .layer-3 .section-num { color: var(--layer3); border-color: rgba(34, 197, 94, 0.3); text-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
  .layer-4 .section-num { color: var(--layer4); border-color: rgba(163, 230, 53, 0.3); text-shadow: 0 0 8px rgba(163, 230, 53, 0.5); }

  .section-title {
    flex: 1;
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .section-count {
    font-size: 0.72rem;
    color: var(--txt-dim);
    background: rgba(8, 43, 20, 0.7);
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    border: 1px solid var(--line);
  }

  .chevron {
    color: var(--txt-dim);
    transition: transform 0.3s, color 0.3s;
    font-size: 0.75rem;
  }

  .section.open .chevron {
    transform: rotate(180deg);
    color: var(--accent);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
  }

  .section-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    border-top: 0 solid var(--line);
  }

  .section.open .section-body {
    max-height: 2500px;
    border-top-width: 1px;
  }

  .sub-list { list-style: none; padding: 0.75rem 1rem; }

  .sub-item {
    padding: 0.55rem 0.85rem;
    border-radius: 8px;
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    font-size: 0.88rem;
    color: var(--txt-dim);
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .sub-item:hover {
    background: rgba(57, 255, 20, 0.08);
    color: var(--txt);
    border-left-color: var(--accent);
    box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.05);
  }

  .sub-num {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.74rem;
    color: var(--accent);
    min-width: 52px;
    opacity: 0.85;
    flex-shrink: 0;
    text-shadow: 0 0 6px rgba(57, 255, 20, 0.4);
  }

  .sub-text { flex: 1; }

  .cross-ref {
    font-size: 0.72rem;
    color: var(--gold);
    opacity: 0.9;
    font-style: italic;
  }

  /* ---------- CROSS-CUTTING ---------- */
  .cross-cutting {
    max-width: 1100px;
    margin: 2rem auto 0;
    padding: 1.5rem;
    border: 1px dashed var(--line-hover);
    border-radius: var(--radius);
    background: rgba(3, 13, 6, 0.4);
    backdrop-filter: blur(6px);
    position: relative;
    z-index: 1;
  }

  .cross-cutting h3 {
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.4em;
    color: var(--txt-dim);
    margin-bottom: 1.25rem;
    text-transform: uppercase;
    padding-left: 0.4em;
  }

  .cc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
  }

  .cc-card {
    padding: 0.9rem 0.75rem;
    border-radius: 10px;
    background: rgba(8, 43, 20, 0.5);
    border: 1px solid var(--line);
    text-align: center;
    transition: all 0.22s;
    cursor: pointer;
  }

  .cc-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(57, 255, 20, 0.2),
                0 0 24px rgba(57, 255, 20, 0.15);
    background: rgba(8, 43, 20, 0.75);
  }

  .cc-icon {
    display: block;
    margin: 0 auto 0.45rem;
    width: 26px;
    height: 26px;
    color: var(--accent);
    transition: color 0.2s, filter 0.2s;
    filter: drop-shadow(0 0 6px rgba(57, 255, 20, 0.5));
  }

  .cc-card:hover .cc-icon {
    color: var(--accent-2);
    filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.8));
  }

  .cc-name { font-size: 0.88rem; font-weight: 600; color: var(--txt); letter-spacing: 0.02em; }
  .cc-refs {
    font-size: 0.68rem;
    color: var(--txt-dim);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    margin-top: 0.25rem;
    letter-spacing: 0.02em;
  }

  /* ---------- FOOTER ---------- */
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--txt-dim);
    font-size: 0.82rem;
    position: relative;
    z-index: 1;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.7), transparent);
    margin-top: 2rem;
  }

  footer .name {
    font-size: 1.5rem;
    font-style: italic;
    margin-bottom: 0.4rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.4));
  }

  footer .roles {
    letter-spacing: 0.5em;
    font-size: 0.7rem;
    text-transform: uppercase;
    padding-left: 0.5em;
  }

  /* ---------- NO RESULTS ---------- */
  .no-results {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--txt-dim);
    display: none;
  }

  .no-results.show { display: block; }
  .no-results .big {
    display: block;
    margin: 0 auto 0.75rem;
    width: 48px;
    height: 48px;
    color: var(--txt-dim);
    opacity: 0.6;
  }

  /* ---------- BACK TO TOP ---------- */
  .to-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--bg-black);
    border: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 1.15rem;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(57, 255, 20, 0.5),
                0 0 40px rgba(57, 255, 20, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 99;
  }

  .to-top.show { opacity: 1; pointer-events: auto; }
  .to-top:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 28px rgba(57, 255, 20, 0.7),
                0 0 60px rgba(57, 255, 20, 0.5);
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 640px) {
    header { padding: 2rem 1rem 1.5rem; }
    .logo-wrap { width: 110px; height: 110px; }
    .brand-name { font-size: 0.85rem; letter-spacing: 0.4em; }
    h1 { font-size: 0.8rem; letter-spacing: 0.2em; }
    .tagline { font-size: 0.88rem; }
    .controls { padding: 0.75rem 1rem; }
    .section-head { padding: 0.85rem 1rem; gap: 0.6rem; }
    .section-num { min-width: 34px; height: 34px; font-size: 0.78rem; }
    .section-title { font-size: 0.88rem; }
    .section-count { display: none; }
    .sub-item { font-size: 0.82rem; padding: 0.5rem 0.6rem; }
    .sub-num { min-width: 44px; font-size: 0.68rem; }
    .stats { gap: 1rem; font-size: 0.7rem; }
  }

  /* ---------- PRINT ---------- */
  @media print {
    body { background: white; color: black; }
    body::before { display: none; }
    .controls, .to-top, .stats { display: none; }
    .section-body { max-height: none !important; }
    .section { border: 1px solid #ccc; page-break-inside: avoid; }
  }
</style>
</head>

     HEADER

<header>

<div class="controls">

<footer>

  <div class="roles">Data • ML • MLOps</div>
</footer>

<button class="to-top" id="toTop" title="Back to top">↑</button>

<script>

  { layer: 1, num: 5, title: "Data Semantics & Metadata", subs: [

const LAYER_META = {
  1: { label: "Layer 1 — Core Data Preparation",                range: "Sections 1 – 25", color: "layer-1" },
  2: { label: "Layer 2 — Specialized Data Preparation",         range: "Sections 26 – 29", color: "layer-2" },
  3: { label: "Layer 3 — Production, Governance & MLOps",       range: "Sections 30 – 40", color: "layer-3" },
  4: { label: "Optional — AI / LLM Era Specialization",         range: "Section 41",       color: "layer-4" }
};

/* ============================================================
   RENDER
   ============================================================ */
const main = document.getElementById('main');
const noResults = document.getElementById('noResults');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
const toTop = document.getElementById('toTop');

let currentFilter = 'all';
let currentSearch = '';
const STORAGE_KEY = 'dp-curriculum-open-v5';

function loadOpenState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveOpenState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
let openState = loadOpenState();

function render() {
  const grouped = { 1: [], 2: [], 3: [], 4: [] };
  CURRICULUM.forEach(s => grouped[s.layer].push(s));

  let totalSubs = 0;
  let visibleCount = 0;
  let html = '';

  [1, 2, 3, 4].forEach(layer => {
    const sections = grouped[layer];
    const visibleSections = sections.filter(s => {
      const matchesFilter = currentFilter === 'all' || currentFilter === String(layer);
      if (!matchesFilter) return false;
      if (!currentSearch) return true;
      const q = currentSearch.toLowerCase();
      return s.title.toLowerCase().includes(q) ||
        s.subs.some(sub => sub.toLowerCase().includes(q));
    });

    if (visibleSections.length === 0) return;

    const meta = LAYER_META[layer];
    html += `<div class="${meta.color}">`;
    html += `<div class="layer-header">
      <h2>${meta.label}</h2>
      <span class="range">${meta.range}</span>
    </div>`;

    visibleSections.forEach(sec => {
      const id = `sec-${sec.num}`;
      const isOpen = openState[id] || currentSearch.length > 0;
      const subsHtml = sec.subs.map((sub, i) => {
        let subText = sub;
        let crossRef = '';
        const m = sub.match(/^(.*?)\s*\((Cross-ref[^)]*)\)\s*$/);
        if (m) { subText = m[1]; crossRef = `<span class="cross-ref">(${m[2]})</span>`; }
        return `<li class="sub-item">
          <span class="sub-num">${sec.num}-${i + 1}</span>
          <span class="sub-text">${subText} ${crossRef}</span>
        </li>`;
      }).join('');

      html += `
        <div class="section ${isOpen ? 'open' : ''}" id="${id}">
          <div class="section-head" data-target="${id}">
            <div class="section-num">${sec.num}</div>
            <div class="section-title">${sec.title}</div>
            <div class="section-count">${sec.subs.length} sub</div>
            <div class="chevron">▼</div>
          </div>
          <div class="section-body">
            <ul class="sub-list">${subsHtml}</ul>
          </div>
        </div>
      `;
      totalSubs += sec.subs.length;
      visibleCount++;
    });

    html += `</div>`;
  });

  main.innerHTML = html;
  noResults.classList.toggle('show', visibleCount === 0);

  document.getElementById('stat-sections').textContent = visibleCount;
  document.getElementById('stat-subs').textContent = totalSubs;

  main.querySelectorAll('.section-head').forEach(head => {
    head.addEventListener('click', () => {
      const id = head.dataset.target;
      const section = document.getElementById(id);
      section.classList.toggle('open');
      openState[id] = section.classList.contains('open');
      saveOpenState(openState);
    });
  });
}

function renderCrossCutting() {
  const grid = document.getElementById('ccGrid');
  grid.innerHTML = CROSS_CUTTING.map(cc => `
    <div class="cc-card" data-refs="${cc.refs}">
      <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${cc.svg}</svg>
      <div class="cc-name">${cc.name}</div>
      <div class="cc-refs">${cc.refs}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.cc-card').forEach(card => {
    card.addEventListener('click', () => {
      const refs = card.dataset.refs;
      const first = refs.split(',')[0].trim().split('-')[0];
      searchInput.value = '';
      currentSearch = '';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-layer="all"]').classList.add('active');
      currentFilter = 'all';
      render();
      setTimeout(() => {
        const el = document.getElementById(`sec-${first}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('open');
          openState[`sec-${first}`] = true;
          saveOpenState(openState);
        }
      }, 100);
    });
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
searchInput.addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  render();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.layer;
    render();
  });
});

window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 400);
});

toTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
});

/* ============================================================
   INIT
   ============================================================ */
render();
renderCrossCutting();
</script>
